<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="theme-color" content="#111827" />
  <title>متابعة التمرين - Plan v2.1 Final</title>
  <style>
    :root{
      --bg:#0b1220; --card:#111827; --card2:#172033; --text:#f8fafc;
      --muted:#94a3b8; --accent:#22c55e; --accent2:#38bdf8; --danger:#ef4444;
      --border:#273449; --gold:#f59e0b;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,Tahoma,sans-serif;background:linear-gradient(180deg,#08101c,#0b1220 40%);color:var(--text)}
    .app{max-width:1050px;margin:auto;padding:14px}
    .header{position:sticky;top:0;z-index:20;background:rgba(11,18,32,.94);backdrop-filter:blur(10px);padding:12px 0 10px}
    h1{font-size:24px;margin:0 0 6px}
    .sub{color:var(--muted);font-size:13px}
    .toolbar{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
    select,button,input,textarea{font:inherit}
    select,.btn{width:100%;padding:12px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text)}
    .btn{cursor:pointer;font-weight:700}
    .btn.primary{background:var(--accent);color:#04130a;border:none}
    .btn.secondary{background:var(--card2)}
    .btn.danger{background:#3a1518;color:#fecaca;border-color:#7f1d1d}
    .summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
    .stat{background:var(--card);border:1px solid var(--border);padding:12px;border-radius:14px;text-align:center}
    .stat b{display:block;font-size:20px;color:var(--accent2)}
    .day-tabs{display:flex;gap:7px;overflow:auto;padding:4px 0 10px}
    .day-tab{flex:0 0 auto;padding:10px 13px;border-radius:999px;background:var(--card);border:1px solid var(--border);color:var(--text);cursor:pointer}
    .day-tab.active{background:var(--accent2);color:#06121a;border-color:transparent;font-weight:800}
    .card{background:var(--card);border:1px solid var(--border);border-radius:16px;margin:10px 0;overflow:hidden}
    .exercise-head{display:flex;align-items:center;gap:10px;padding:14px}
    .check{width:23px;height:23px;accent-color:var(--accent);flex:0 0 auto}
    .ex-title{flex:1}
    .ex-title h3{font-size:16px;margin:0 0 5px}
    .meta{font-size:12px;color:var(--muted)}
    .tech{margin-top:8px;padding:9px 10px;border-radius:10px;background:#0c1525;color:#dbeafe;font-size:12px;line-height:1.6}.badge{font-size:11px;padding:5px 8px;border-radius:999px;background:#263248;color:#dbeafe}
    .badge.pr{background:#4a3405;color:#fde68a}
    .fields{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 14px 14px}
    label{font-size:11px;color:var(--muted)}
    input,textarea{width:100%;margin-top:5px;padding:10px;border-radius:10px;border:1px solid var(--border);background:#0c1525;color:var(--text)}
    textarea{min-height:42px;resize:vertical}
    .notes{grid-column:1/-1}
    .done{opacity:.68}
    .done .ex-title h3{text-decoration:line-through}
    .footer-actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:16px 0 80px}
    .tip{background:#102136;border:1px solid #1e3a5f;color:#dbeafe;padding:12px;border-radius:14px;font-size:13px;line-height:1.7}
    .empty{padding:30px;text-align:center;color:var(--muted)}
    .week-note{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px;margin-bottom:10px}
    .week-note textarea{min-height:70px}
    @media(max-width:700px){
      .fields{grid-template-columns:1fr 1fr}
      .summary{grid-template-columns:repeat(3,1fr)}
      .toolbar{grid-template-columns:1fr 1fr}
      h1{font-size:20px}
      .footer-actions{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>متابعة التمرين — Plan v2.1 Final</h1>
    <div class="sub">12 أسبوع • حفظ تلقائي على الجهاز • تتبع أقوى وزن والالتزام</div>

    <div class="toolbar">
      <select id="weekSelect"></select>
      <button class="btn primary" id="todayBtn">اذهب لأسبوع البداية</button>
    </div>

    <div class="summary">
      <div class="stat"><b id="doneCount">0</b><span>تمرين مكتمل</span></div>
      <div class="stat"><b id="totalCount">0</b><span>إجمالي التمارين</span></div>
      <div class="stat"><b id="progress">0%</b><span>التزام الأسبوع</span></div>
    </div>

    <div class="day-tabs" id="dayTabs"></div>
  </div>

  <div class="tip">
    سجّل أقوى وزن استخدمته في المجموعة الأفضل، وعدد العدات وRIR الحقيقي. البيانات تتحفظ تلقائيًا داخل المتصفح.
  </div>

  <div class="week-note">
    <label>ملاحظات الأسبوع: النوم، الألم، الطاقة، الوزن، الوسط</label>
    <textarea id="weekNotes" placeholder="مثال: متوسط الوزن 96.8 كجم، النوم 7 ساعات، ألم الكوع 0/10..."></textarea>
  </div>

  <div id="exerciseList"></div>

  <div class="footer-actions">
    <button class="btn secondary" id="exportBtn">تصدير نسخة احتياطية</button>
    <button class="btn secondary" id="importBtn">استيراد نسخة</button>
    <button class="btn danger" id="resetBtn">مسح كل البيانات</button>
    <input type="file" id="importFile" accept=".json" hidden>
  </div>
</div>

<script>
const plan = {
  "Push A": [
    ["Incline Dumbbell Press","دامبل","3","6–8","RIR 1","ميل البنش 20–30°، لوح الكتف ثابت للخلف. البديل: Incline Chest Press Machine"],
    ["Flat Dumbbell Press","دامبل","3","8–10","RIR 1","الكوع 45–60°، نزول بتحكم. البديل: Flat Chest Press Machine"],
    ["Pec Deck Fly","جهاز","2","10–15","RIR 1–2","المرفق ثابت بانحناءة بسيطة، اقفل بالصدر. البديل: Middle Cable Fly"],
    ["Machine Shoulder Press","جهاز","3","8–10","RIR 1–2","المقابض قرب مستوى الأذن، الظهر ثابت. البديل: Smith Shoulder Press"],
    ["Standing Dumbbell Lateral Raise","دامبل","3","12–15","RIR 1–2","ارفع بالكوع لمستوى الكتف من غير مرجحة. البديل: Seated Dumbbell Lateral Raise"],
    ["One Arm Dumbbell Overhead Extension","دامبل","3","10–12","RIR 1–2","الكوع ثابت بجانب الرأس. البديل: One Arm Cable Overhead Extension"],
    ["Rope Pushdown","كابل","2","12–15","آخر مجموعة RIR 0–1","الكوع ثابت وافتح طرفي الحبل أسفل الحركة. البديل: Straight Bar Pushdown"]
  ],
  "Pull A": [
    ["Lat Pulldown","كابل/جهاز","3","6–10","RIR 1","قبضة Overhand أعرض قليلًا من الكتف؛ اسحب لأعلى الصدر والكوع لتحت. البديل: Assisted Pull-Up بنفس القبضة"],
    ["Chest Supported Row Machine","جهاز","3","8–12","RIR 1","المقابض القريبة Neutral؛ الكوع قريب 30–45°، السحب لأعلى البطن/أسفل الضلوع. البديل: Chest Supported Dumbbell Row"],
    ["Iso-Lateral Row Machine","جهاز","3","10–12","RIR 1–2","قبضة Neutral، ذراع بذراع، اسحب الكوع ناحية الحوض. البديل: One Arm Cable Row"],
    ["Face Pull","كابل","2","12–15","RIR 1–2","الحبل ناحية الوجه والكوع مفتوح. البديل: Rear-Delt Cable Row"],
    ["Incline Dumbbell Curl","دامبل","3","8–12","RIR 1–2","الذراع خلف الجسم والكوع ثابت. البديل: Standing Alternating Dumbbell Curl"],
    ["Preacher Curl","جهاز أو EZ","3","10–15","آخر مجموعة RIR 0–1","ثبت العضد على الوسادة ولا تفرد الكوع بعنف. البديل: Machine Preacher Curl"]
  ],
  "Legs": [
    ["Hack Squat","جهاز","3","6–8","RIR 1","الركبة مع اتجاه الأصابع، انزل لمدى ثابت. البديل: Leg Press"],
    ["Romanian Deadlift","بار أو دامبل","3","8–10","RIR 1","ادفع الحوض للخلف والظهر محايد. البديل: Smith Romanian Deadlift"],
    ["Leg Press","جهاز","3","10–12","RIR 1–2","لا ترفع الحوض من الكرسي ولا تقفل الركبة بعنف. البديل: Pendulum Squat"],
    ["Leg Curl","جهاز","3","10–12","RIR 1–2","الحوض ثابت واعصر الهامسترنج. البديل: Seated أو Lying Leg Curl"],
    ["Leg Extension","جهاز","3","12–15","RIR 1–2","محور الجهاز مع الركبة وارفع بتحكم. البديل: Single-Leg Extension"],
    ["Standing Calf Raise","جهاز","4","10–15","آخر مجموعة RIR 0–1","نزول كامل وتوقف أعلى الحركة من غير نط. البديل: Leg Press Calf Raise"]
  ],
  "Push B": [
    ["High Cable Fly","كابل","2","12–15","RIR 1–2","البكرات عالية واسحب لأسفل وأمام ناحية أسفل الصدر. البديل: Decline Cable Fly"],
    ["Low Cable Fly","كابل","2","12–15","RIR 1–2","البكرات منخفضة واجمع لأعلى ناحية أعلى الصدر. البديل: Low-to-High Single Arm Fly"],
    ["Machine Chest Press","جهاز","3","8–10","RIR 1","المقابض في مستوى منتصف الصدر. البديل: Smith Flat Press"],
    ["Seated Dumbbell Shoulder Press","دامبل","3","8–10","RIR 1","الكوع أسفل الرسغ ولا تقوس أسفل الظهر. البديل: Arnold Press لو مريح"],
    ["Seated Dumbbell Lateral Raise","دامبل","3","12–15","RIR 1–2","من الجلوس لتقليل المرجحة، ارفع بالكوع. البديل: Standing Dumbbell Lateral Raise"],
    ["Overhead Rope Extension","كابل","3","10–12","RIR 1–2","الكوع ثابت فوق الرأس وخد تمدد مريح. البديل: One Arm Dumbbell Overhead Extension"],
    ["Cable Kickback","كابل","2","12–15","آخر مجموعة RIR 0–1","العضد ثابت خلف الجسم وافرد الكوع بالكامل. البديل: Dumbbell Kickback"]
  ],
  "Pull B": [
    ["Assisted Pull-Up","جهاز","3","6–10","RIR 1","قبضة Neutral متوسطة؛ الكفان مواجهان لبعض، اسحب الصدر ناحية المقابض. البديل: Neutral-Grip Lat Pulldown"],
    ["Chest Supported T-Bar Row Machine","جهاز","3","8–12","RIR 1","المقابض الواسعة أو Overhand؛ الكوع مفتوح 60–75°، السحب لأسفل الصدر. البديل: Wide-Grip Chest Supported Row"],
    ["Straight Arm Pulldown","كابل","2","12–15","RIR 1–2","بار مستقيم أو حبل، الكوع شبه ثابت، اسحب للفخذ. البديل: Machine Pullover"],
    ["Reverse Pec Deck","جهاز","3","12–15","RIR 1–2","الذراع في مستوى الكتف، افتح للخلف من غير رفع الترابيس. البديل: Rear Delt Cable Fly"],
    ["Back Extension","جهاز/بنش","2","12–15","RIR 2–3","الحركة من مفصل الحوض، اطلع لحد الجسم مستقيم فقط. البديل: 45° Hip Extension"],
    ["Hammer Curl","دامبل","3","10–12","RIR 1–2","قبضة Neutral والكوع ثابت. البديل: Rope Hammer Curl"],
    ["Bayesian Cable Curl","كابل","3","12–15","آخر مجموعة RIR 0–1","البكرة منخفضة خلفك، الذراع خلف الجسم والكوع ثابت. البديل: Spider Curl أو Cable Curl بالبار"]
  ],
  "Abs": [
    ["Cable Crunch","كابل","3","12–15","RIR 1–2","لف القفص الصدري ناحية الحوض. البديل: Machine Crunch"],
    ["Reverse Crunch","وزن جسم","3","12–15","RIR 1–2","ارفع الحوض ناحية القفص الصدري من غير رمي الرجل. البديل: Bent-Knee Leg Raise"],
    ["Vacuum","تنفس وتحكم","3","20–30 ثانية","مريح","بعد الزفير اسحب البطن للداخل. البديل: Dead Bug"]
  ]
};

const STORAGE_KEY = "gym_tracker_plan_v2_1_final";
let state = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{"weeks":{},"weekNotes":{}}');
let currentWeek = 1;
let currentDay = "Push A";

const weekSelect = document.getElementById("weekSelect");
for(let i=1;i<=12;i++){
  const opt=document.createElement("option");
  opt.value=i; opt.textContent=`الأسبوع ${i}`;
  weekSelect.appendChild(opt);
}
weekSelect.value=currentWeek;

function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

function ensureEntry(week,day,index){
  state.weeks[week] ??= {};
  state.weeks[week][day] ??= {};
  state.weeks[week][day][index] ??= {done:false,weight:"",reps:"",rir:"",notes:""};
  return state.weeks[week][day][index];
}

function bestWeight(exerciseName){
  let max = null;
  Object.values(state.weeks || {}).forEach(w=>{
    Object.entries(w).forEach(([day, entries])=>{
      (plan[day]||[]).forEach((ex, idx)=>{
        if(ex[0]===exerciseName && entries[idx]){
          const val=parseFloat(entries[idx].weight);
          if(!isNaN(val)) max=max===null?val:Math.max(max,val);
        }
      });
    });
  });
  return max;
}

function renderTabs(){
  const tabs=document.getElementById("dayTabs");
  tabs.innerHTML="";
  Object.keys(plan).forEach(day=>{
    const b=document.createElement("button");
    b.className="day-tab"+(day===currentDay?" active":"");
    b.textContent=day;
    b.onclick=()=>{currentDay=day;render()};
    tabs.appendChild(b);
  });
}

function render(){
  renderTabs();
  const list=document.getElementById("exerciseList");
  list.innerHTML="";
  const exercises=plan[currentDay]||[];
  exercises.forEach((ex,idx)=>{
    const data=ensureEntry(currentWeek,currentDay,idx);
    const currentPR=bestWeight(ex[0]);
    const card=document.createElement("div");
    card.className="card"+(data.done?" done":"");
    card.innerHTML=`
      <div class="exercise-head">
        <input class="check" type="checkbox" ${data.done?"checked":""}>
        <div class="ex-title">
          <h3>${idx+1}. ${ex[0]}</h3>
          <div class="meta">${ex[1]} • ${ex[2]} مجموعات × ${ex[3]} عدات • ${ex[4]}</div><div class="tech"><b>القبضة والتنفيذ/البديل:</b> ${ex[5]}</div>
        </div>
        ${currentPR!==null?`<span class="badge pr">PR ${currentPR} كجم</span>`:`<span class="badge">بدون رقم</span>`}
      </div>
      <div class="fields">
        <label>أقوى وزن كجم<input inputmode="decimal" data-key="weight" value="${data.weight}"></label>
        <label>العدات<input inputmode="numeric" data-key="reps" value="${data.reps}"></label>
        <label>RIR<input inputmode="numeric" data-key="rir" value="${data.rir}"></label>
        <label>المجموعات المنفذة<input inputmode="numeric" data-key="setsDone" value="${data.setsDone||""}"></label>
        <label class="notes">ملاحظات<textarea data-key="notes">${data.notes}</textarea></label>
      </div>`;
    card.querySelector(".check").onchange=e=>{
      data.done=e.target.checked; save(); render();
    };
    card.querySelectorAll("[data-key]").forEach(inp=>{
      inp.oninput=e=>{
        data[e.target.dataset.key]=e.target.value; save(); updateSummary();
      };
    });
    list.appendChild(card);
  });
  const wn = state.weekNotes[currentWeek] || "";
  document.getElementById("weekNotes").value=wn;
  updateSummary();
}

function updateSummary(){
  let done=0,total=0;
  Object.keys(plan).forEach(day=>{
    plan[day].forEach((_,idx)=>{
      total++;
      if(ensureEntry(currentWeek,day,idx).done) done++;
    });
  });
  document.getElementById("doneCount").textContent=done;
  document.getElementById("totalCount").textContent=total;
  document.getElementById("progress").textContent=Math.round(done/total*100)+"%";
}

weekSelect.onchange=e=>{currentWeek=parseInt(e.target.value);render()};
document.getElementById("todayBtn").onclick=()=>{currentWeek=1;weekSelect.value=1;render()};
document.getElementById("weekNotes").oninput=e=>{
  state.weekNotes[currentWeek]=e.target.value; save();
};

document.getElementById("exportBtn").onclick=()=>{
  const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="gym-tracker-backup.json";
  a.click();
  URL.revokeObjectURL(a.href);
};

document.getElementById("importBtn").onclick=()=>document.getElementById("importFile").click();
document.getElementById("importFile").onchange=e=>{
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      state=JSON.parse(reader.result);
      save(); render(); alert("تم استيراد البيانات بنجاح");
    }catch{ alert("الملف غير صالح"); }
  };
  reader.readAsText(file);
};

document.getElementById("resetBtn").onclick=()=>{
  if(confirm("متأكد إنك عايز تمسح كل بيانات الـ12 أسبوع؟")){
    state={weeks:{},weekNotes:{}}; save(); render();
  }
};

render();
</script>
</body>
</html>
